defaults:
  tag: dialog
  attrs:
    id: haz_search_pagefind_modal
    class: haz_search_pagefind_modal
  close:
    enabled: true
    attrs:
      type: button
      class: haz_btn haz_search_pagefind_modal__close
      aria-label: Close search
      data:
        haz_toggler: "true"
        haz_toggle: haz_state__searching
merge_paths:
  - - attrs
  - - close
    - attrs
