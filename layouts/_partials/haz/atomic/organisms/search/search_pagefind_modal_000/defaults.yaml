defaults:
  tag: dialog
  attrs:
    id: haz_search_pagefind_modal
    class: haz_search_pagefind_modal
    data:
      haz_modal_focus: pagefind-input
  close:
    enabled: true
    attrs:
      type: button
      class: haz_btn haz_search_pagefind_modal__close
      aria-label: Close search
      data:
        haz_modal: "true"
merge_paths:
  - - attrs
  - - close
    - attrs
