defaults:
  tag: dialog
  attrs:
    id: haz_search_pagefind_modal
    class: haz_search_pagefind_modal
  close:
    enabled: true
    attrs:
      type: button
      class: haz_btn haz_search_pagefind_modal__close
      aria-label: Close search
  order:
    - assets
    - config
    - input
    - results
merge_paths:
  - - attrs
  - - close
    - attrs
